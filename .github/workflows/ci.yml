name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Build Docker image
    needs: quality
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
